<!doctype html>
<html lang="en" data-site-kind="wordle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Wordle</title>
    <link vite-ignore rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link vite-ignore rel="stylesheet" href="./site.css" data-samey-shared>
    <script vite-ignore src="./shared-runtime.js"></script>
  </head>
  <body>
    <div id="wordle-app-mount">
      <div data-wordle-boot-shell data-wordle-root>
        <header class="site-topbar">
          <div class="site-topbar-inner site-topbar-inner-contained">
            <div class="site-topbar-start"><a class="brand home-brand-link" href="/" aria-label="Sanyam Brar · Home"><span class="home-brand-name">Sanyam Brar</span></a></div>
            <div class="site-topbar-context wordle-topbar-context"></div>
            <nav class="top-nav site-topbar-nav game-topbar-nav" aria-label="Wordle">
              <button class="top-icon site-topbar-icon" type="button" tabindex="-1" aria-hidden="true">◐</button>
              <button class="site-topbar-search" type="button" tabindex="-1" aria-hidden="true">Search <kbd>Ctrl K</kbd></button>
            </nav>
          </div>
        </header>
        <main class="wordle-opening" aria-hidden="true">
          <div class="wordle-opening-inner">
            <h1>Choose a game</h1>
            <div class="wordle-mode-grid">
              <section class="wordle-mode-card wordle-mode-card-primary"><h2>Daily</h2><p>Today’s puzzle.</p><div class="wordle-boot-action">Play daily</div></section>
              <section class="wordle-mode-card"><h2>Random</h2><p>Start a fresh random puzzle.</p><div class="wordle-boot-action">Play random</div></section>
              <section class="wordle-mode-card"><h2>Advanced</h2><p>Choose length and challenge options.</p><div class="wordle-boot-action">Configure</div></section>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/games/wordle/index.tsx"></script>
  </body>
</html>
