<!doctype html>
<html lang="en" data-spa data-home-href="./" data-site-kind="chain">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
  <title>Chain Reaction · Sanyam Brar</title>
  <script src="./appearance.generated.js"></script>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./shared/game-settings.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--site-bg,#fff);color:var(--site-fg,#121213);font-family:var(--site-font,Arial,Helvetica,sans-serif)}
    button,input{font:inherit;color:inherit}
    .chain-shell{position:relative;height:100dvh;background:var(--site-bg,#fff)}
    .chain-stage{position:absolute;inset:0;min-width:0;min-height:0;display:grid;place-items:center;padding:62px 22px 22px;overflow:hidden;touch-action:none;user-select:none}
    #chain-canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
    .chain-turn{position:fixed;top:var(--game-control-top);left:50%;z-index:38;height:var(--game-control-size);display:flex;align-items:center;gap:14px;color:var(--site-muted,#787c7e);font-size:11px;font-weight:700;letter-spacing:.08em;transform:translateX(-50%);pointer-events:none}
    .chain-turn-item{display:flex;align-items:center;gap:7px;white-space:nowrap}
    .chain-turn-item+ .chain-turn-item::before{content:"";width:1px;height:14px;margin-right:1px;background:var(--site-line,#d3d6da)}
    .chain-turn-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb,var(--site-fg,#121213) 28%,transparent)}
    .chain-settings-trigger{position:fixed;top:var(--game-control-top);right:var(--game-control-right);z-index:39}
    .chain-settings{opacity:0;transform:translateY(-3px) scale(.99);transform-origin:top right;pointer-events:none;transition:opacity 90ms ease,transform 90ms ease}
    .chain-settings[data-open="true"]{opacity:1;transform:none;pointer-events:auto}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-width:640px){.chain-stage{padding:58px 12px 12px}}
  </style>
</head>
<body>
  <div class="chain-shell">
    <div id="chain-turn" class="chain-turn" aria-hidden="true">
      <span class="chain-turn-item"><span>YOU</span><span id="chain-you-dot" class="chain-turn-dot"></span></span>
      <span class="chain-turn-item"><span>TURN</span><span id="chain-active-dot" class="chain-turn-dot"></span></span>
    </div>
    <button id="chain-settings-button" class="game-settings-trigger chain-settings-trigger" type="button" aria-label="Settings" aria-expanded="false" aria-controls="chain-settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3v-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.07V3h4v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.93 10H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
    </button>
    <aside id="chain-settings" class="game-settings-popover chain-settings" aria-hidden="true">
      <button id="chain-settings-close" type="button" class="game-settings-close" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="game-settings-body">
        <div class="game-settings-section-title">BOARD</div>
        <label class="game-settings-slider" for="chain-rows">
          <span class="game-settings-slider-head"><span class="game-settings-slider-label">Rows</span><output id="chain-rows-value" class="game-settings-slider-value"></output></span>
          <input id="chain-rows" type="range" min="4" max="14" step="1">
        </label>
        <label class="game-settings-slider" for="chain-cols">
          <span class="game-settings-slider-head"><span class="game-settings-slider-label">Columns</span><output id="chain-cols-value" class="game-settings-slider-value"></output></span>
          <input id="chain-cols" type="range" min="4" max="12" step="1">
        </label>
        <label class="game-settings-slider" for="chain-enemies">
          <span class="game-settings-slider-head"><span class="game-settings-slider-label">Enemies</span><output id="chain-enemies-value" class="game-settings-slider-value"></output></span>
          <input id="chain-enemies" type="range" min="1" max="5" step="1">
        </label>
        <div class="game-settings-actions">
          <button id="chain-new-game" class="game-settings-action" type="button">New Game</button>
        </div>
      </div>
    </aside>
    <main id="chain-stage" class="chain-stage">
      <canvas id="chain-canvas" aria-label="Chain Reaction board"></canvas>
      <div id="chain-status" class="sr-only" aria-live="polite"></div>
    </main>
  </div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('chain-canvas');
  const stage = document.getElementById('chain-stage');
  const statusEl = document.getElementById('chain-status');
  const turnEl = document.getElementById('chain-turn');
  const youDot = document.getElementById('chain-you-dot');
  const activeDot = document.getElementById('chain-active-dot');
  const settingsButton = document.getElementById('chain-settings-button');
  const settingsPanel = document.getElementById('chain-settings');
  const settingsClose = document.getElementById('chain-settings-close');
  const newGameButton = document.getElementById('chain-new-game');
  const rowsInput = document.getElementById('chain-rows');
  const colsInput = document.getElementById('chain-cols');
  const enemiesInput = document.getElementById('chain-enemies');
  const rowsValue = document.getElementById('chain-rows-value');
  const colsValue = document.getElementById('chain-cols-value');
  const enemiesValue = document.getElementById('chain-enemies-value');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

  const EMPTY = 0;
  const HUMAN = 1;
  const PLAYER_COLORS = ['', '#6aaa64', '#c95d63', '#6b8fd6', '#b07aa1', '#d2a94b', '#62a8a8'];
  const defaults = { rows: 9, cols: 6, enemies: 1 };
  let config = loadConfig();
  let rows = config.rows;
  let cols = config.cols;
  let playerCount = config.enemies + 1;
  let board, owners, degree, neighbors, entered;
  let turn = HUMAN;
  let locked = false;
  let gameOver = false;
  let cssW = 0, cssH = 0, cell = 0, ox = 0, oy = 0, dpr = 1;
  let frame = 0;
  let particles = [];
  let gameVersion = 0;
  const orbCache = new Map();

  function clampInt(value, min, max, fallback) {
    const n = Number.parseInt(value, 10);
    return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
  }

  function loadConfig() {
    try {
      const saved = JSON.parse(localStorage.getItem('samey.chain.settings') || '{}');
      return {
        rows: clampInt(saved.rows, 4, 14, defaults.rows),
        cols: clampInt(saved.cols, 4, 12, defaults.cols),
        enemies: clampInt(saved.enemies, 1, 5, defaults.enemies),
      };
    } catch { return {...defaults}; }
  }

  function saveConfig() {
    try { localStorage.setItem('samey.chain.settings', JSON.stringify(config)); } catch {}
  }

  function buildBoard() {
    rows = config.rows;
    cols = config.cols;
    playerCount = config.enemies + 1;
    board = new Uint8Array(rows * cols);
    owners = new Uint8Array(rows * cols);
    degree = new Uint8Array(rows * cols);
    neighbors = Array.from({length: rows * cols}, () => []);
    entered = new Uint8Array(playerCount + 1);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (r) neighbors[i].push(i - cols);
      if (c) neighbors[i].push(i - 1);
      if (c + 1 < cols) neighbors[i].push(i + 1);
      if (r + 1 < rows) neighbors[i].push(i + cols);
      degree[i] = neighbors[i].length;
    }
  }

  const css = () => getComputedStyle(document.documentElement);
  const color = (name, fallback) => css().getPropertyValue(name).trim() || fallback;
  const playerColor = player => PLAYER_COLORS[player] || `hsl(${(player * 67) % 360} 72% 54%)`;

  function layout() {
    const rect = stage.getBoundingClientRect();
    const stageStyle = getComputedStyle(stage);
    const availableW = Math.max(1, rect.width - parseFloat(stageStyle.paddingLeft) - parseFloat(stageStyle.paddingRight));
    const availableH = Math.max(1, rect.height - parseFloat(stageStyle.paddingTop) - parseFloat(stageStyle.paddingBottom));
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const gap = 2;
    cell = Math.max(1, Math.floor(Math.min((availableW - gap) / cols, (availableH - gap) / rows)));
    cssW = Math.min(availableW, cols * cell + gap);
    cssH = Math.min(availableH, rows * cell + gap);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    orbCache.clear();
    ox = gap / 2; oy = gap / 2;
    draw(performance.now());
  }

  function center(i) {
    return [ox + (i % cols + .5) * cell, oy + (Math.floor(i / cols) + .5) * cell];
  }

  function atomOffsets(n, radius) {
    if (n <= 1) return [[0,0]];
    if (n === 2) return [[-radius*.36,0],[radius*.36,0]];
    if (n === 3) return [[0,-radius*.39],[-radius*.36,radius*.28],[radius*.36,radius*.28]];
    return [[-radius*.32,-radius*.32],[radius*.32,-radius*.32],[-radius*.32,radius*.32],[radius*.32,radius*.32]];
  }

  function mixHex(a, b, t) {
    const n = hex => [1,3,5].map(i => Number.parseInt(hex.slice(i, i + 2), 16));
    const [ar,ag,ab] = n(a), [br,bg,bb] = n(b);
    const c = (x,y) => Math.round(x + (y - x) * t).toString(16).padStart(2, '0');
    return `#${c(ar,br)}${c(ag,bg)}${c(ab,bb)}`;
  }

  function orbSprite(owner, radius) {
    const base = playerColor(owner);
    const key = `${owner}:${radius.toFixed(2)}:${dpr}`;
    let sprite = orbCache.get(key);
    if (sprite) return sprite;
    const pad = 3, size = Math.ceil(radius * 2 + pad * 2);
    sprite = document.createElement('canvas');
    sprite.width = Math.ceil(size * dpr);
    sprite.height = Math.ceil(size * dpr);
    const g = sprite.getContext('2d');
    g.scale(dpr, dpr);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    const c = size / 2;
    const gradient = g.createRadialGradient(c - radius*.34, c - radius*.38, radius*.08, c, c, radius*1.04);
    gradient.addColorStop(0, mixHex(base, '#ffffff', .55));
    gradient.addColorStop(.32, mixHex(base, '#ffffff', .16));
    gradient.addColorStop(.74, base);
    gradient.addColorStop(1, mixHex(base, '#000000', .30));
    g.shadowColor = 'rgba(0,0,0,.18)';
    g.shadowBlur = Math.max(1.5, radius * .22);
    g.shadowOffsetY = Math.max(.5, radius * .08);
    g.fillStyle = gradient;
    g.beginPath(); g.arc(c, c, radius, 0, Math.PI * 2); g.fill();
    g.shadowColor = 'transparent';
    g.strokeStyle = mixHex(base, '#000000', .18);
    g.lineWidth = Math.max(.65, radius * .07);
    g.stroke();
    orbCache.set(key, sprite);
    return sprite;
  }

  function drawOrb(x, y, owner, radius, alpha = 1) {
    const sprite = orbSprite(owner, radius);
    const w = sprite.width / dpr, h = sprite.height / dpr;
    const old = ctx.globalAlpha;
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprite, x - w/2, y - h/2, w, h);
    ctx.globalAlpha = old;
  }

  function draw(now) {
    frame = 0;
    const bg = color('--site-bg', '#fff');
    const boardBg = color('--site-soft', '#f3f4f5');
    const line = color('--site-line', '#d3d6da');
    ctx.fillStyle = boardBg;
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.lineWidth = 1;
    ctx.strokeStyle = line;
    ctx.beginPath();
    for (let c = 0; c <= cols; c++) { const x = ox + c * cell; ctx.moveTo(x, oy); ctx.lineTo(x, oy + rows * cell); }
    for (let r = 0; r <= rows; r++) { const y = oy + r * cell; ctx.moveTo(ox, y); ctx.lineTo(ox + cols * cell, y); }
    ctx.stroke();

    const atomR = Math.max(3.8, Math.min(11, cell * .135));
    for (let i = 0; i < board.length; i++) {
      const count = board[i]; if (!count) continue;
      const [cx, cy] = center(i);
      for (const [dx,dy] of atomOffsets(count, atomR)) drawOrb(cx + dx, cy + dy, owners[i], atomR);
    }

    if (particles.length) {
      let alive = false;
      for (const p of particles) {
        const t = Math.min(1, (now - p.start) / p.duration);
        if (t < 1) alive = true;
        const e = 1 - (1 - t) * (1 - t);
        const x = p.x0 + (p.x1 - p.x0) * e;
        const y = p.y0 + (p.y1 - p.y0) * e;
        drawOrb(x, y, p.owner, atomR, 1 - t * .12);
      }
      ctx.globalAlpha = 1;
      if (alive) requestDraw(); else particles = [];
    }

  }

  function requestDraw() { if (!frame) frame = requestAnimationFrame(draw); }

  function allPlayersEntered() {
    for (let player = 1; player <= playerCount; player++) if (!entered[player]) return false;
    return true;
  }

  function liveWinner(pendingOwner = EMPTY, pending = null) {
    if (!allPlayersEntered()) return EMPTY;
    const live = new Uint8Array(playerCount + 1);
    for (let i = 0; i < board.length; i++) if (board[i]) live[owners[i]] = 1;
    if (pending && pendingOwner) {
      for (let i = 0; i < pending.length; i++) {
        if (pending[i]) { live[pendingOwner] = 1; break; }
      }
    }
    let sole = EMPTY;
    for (let player = 1; player <= playerCount; player++) {
      if (!entered[player] || !live[player]) continue;
      if (sole) return EMPTY;
      sole = player;
    }
    return sole;
  }

  function finishGame(win) {
    gameOver = true;
    turn = win;
    locked = false;
    particles = [];
    updateStatus();
    requestDraw();
  }

  function updateStatus() {
    youDot.style.backgroundColor = playerColor(HUMAN);
    activeDot.style.backgroundColor = playerColor(turn || HUMAN);
    turnEl.setAttribute('aria-label', gameOver
      ? (turn === HUMAN ? 'You win' : `Enemy ${turn - 1} wins`)
      : (turn === HUMAN ? 'Your turn' : `Enemy ${turn - 1} turn`));
    if (gameOver) statusEl.textContent = turn === HUMAN ? 'You win' : `Enemy ${turn - 1} wins`;
    else statusEl.textContent = turn === HUMAN ? 'Your turn' : `Enemy ${turn - 1} turn`;
  }

  function applyAtom(i, owner) { owners[i] = owner; board[i]++; }

  async function playMove(start, owner) {
    const version = gameVersion;
    locked = true;
    entered[owner] = 1;

    // Aggregate pending atoms per cell. A cascade wave is therefore O(board size)
    // instead of O(number of atoms), so edge/corner explosions cannot grow an
    // unbounded JS queue during large reactions.
    let pending = new Uint32Array(board.length);
    pending[start] = 1;

    while (!gameOver) {
      const next = new Uint32Array(board.length);
      const transfers = [];
      let anyPending = false;

      for (let i = 0; i < pending.length; i++) {
        const incoming = pending[i];
        if (!incoming) continue;
        anyPending = true;

        const total = board[i] + incoming;
        const d = degree[i];
        const bursts = Math.floor(total / d);
        const remainder = total - bursts * d;
        board[i] = remainder;
        owners[i] = remainder ? owner : EMPTY;

        if (!bursts) continue;
        const [x0, y0] = center(i);
        for (const n of neighbors[i]) {
          next[n] += bursts;
          // One visual orb per direction is enough to communicate the wave.
          // The simulation itself still propagates every atom via the count.
          const [x1, y1] = center(n);
          transfers.push({x0,y0,x1,y1,owner,start:performance.now(),duration:105});
        }
      }

      if (!anyPending) break;
      requestDraw();

      // Pending transfers are live ownership for the mover. This prevents the
      // mover's last exploding cell from looking eliminated mid-transition, but
      // unlike the old code it does not confuse a multi-owner board with a win.
      const winNow = liveWinner(owner, next);
      if (winNow) { finishGame(winNow); return; }

      let hasNext = false;
      for (let i = 0; i < next.length; i++) if (next[i]) { hasNext = true; break; }
      if (!hasNext) break;

      if (transfers.length) {
        particles = transfers;
        await new Promise(resolve => setTimeout(resolve, 82));
        if (version !== gameVersion) return;
      }
      pending = next;
    }

    particles = [];
    const win = liveWinner();
    if (win) { finishGame(win); return; }
    locked = false;
    turn = nextPlayer(owner);
    updateStatus();
    requestDraw();
  }

  function legalMoves(owner) {
    const out = [];
    for (let i = 0; i < board.length; i++) if (board[i] === 0 || owners[i] === owner) out.push(i);
    return out;
  }

  function hasCells(owner) {
    for (let i = 0; i < owners.length; i++) if (owners[i] === owner) return true;
    return false;
  }

  function nextPlayer(owner) {
    for (let step = 1; step <= playerCount; step++) {
      const candidate = ((owner - 1 + step) % playerCount) + 1;
      if (!entered[candidate] || hasCells(candidate)) return candidate;
    }
    return HUMAN;
  }

  async function continueTurns() {
    const version = gameVersion;
    while (version === gameVersion && !gameOver && turn !== HUMAN && !locked) {
      const player = turn;
      const moves = legalMoves(player);
      if (!moves.length) { entered[player] = 1; turn = nextPlayer(player); continue; }
      await new Promise(resolve => setTimeout(resolve, 65 + Math.random() * 70));
      if (version !== gameVersion || gameOver || turn !== player || locked) return;
      const idx = moves[(Math.random() * moves.length) | 0];
      await playMove(idx, player);
    }
  }

  async function humanMove(i) {
    if (locked || gameOver || turn !== HUMAN) return;
    if (board[i] !== 0 && owners[i] !== HUMAN) {
      canvas.animate([{transform:'translateX(0)'},{transform:'translateX(-2px)'},{transform:'translateX(2px)'},{transform:'translateX(0)'}], {duration:95});
      return;
    }
    await playMove(i, HUMAN);
    continueTurns();
  }

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left - ox;
    const y = e.clientY - rect.top - oy;
    if (x < 0 || y < 0) return -1;
    const c = Math.floor(x / cell), r = Math.floor(y / cell);
    if (c < 0 || c >= cols || r < 0 || r >= rows) return -1;
    return r * cols + c;
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const i = cellFromEvent(e);
    if (i >= 0) humanMove(i);
  });

  function reset() {
    gameVersion++;
    particles = [];
    turn = HUMAN;
    locked = false;
    gameOver = false;
    buildBoard();
    updateStatus();
    layout();
  }

  function setSettingsOpen(open) {
    settingsPanel.dataset.open = String(open);
    settingsPanel.setAttribute('aria-hidden', String(!open));
    settingsButton.setAttribute('aria-expanded', String(open));
  }

  function syncRangeProgress(input) {
    const min = Number(input.min), max = Number(input.max), value = Number(input.value);
    const pct = max > min ? ((value - min) / (max - min)) * 100 : 0;
    input.style.setProperty('--range-progress', `${pct}%`);
  }

  function syncSettings() {
    rowsInput.value = String(config.rows);
    colsInput.value = String(config.cols);
    enemiesInput.value = String(config.enemies);
    rowsValue.value = String(config.rows);
    colsValue.value = String(config.cols);
    enemiesValue.value = String(config.enemies);
    for (const input of [rowsInput, colsInput, enemiesInput]) syncRangeProgress(input);
  }

  function applySettings() {
    config = {
      rows: clampInt(rowsInput.value, 4, 14, defaults.rows),
      cols: clampInt(colsInput.value, 4, 12, defaults.cols),
      enemies: clampInt(enemiesInput.value, 1, 5, defaults.enemies),
    };
    syncSettings();
    saveConfig();
    reset();
  }

  settingsButton.addEventListener('click', () => setSettingsOpen(settingsButton.getAttribute('aria-expanded') !== 'true'));
  settingsClose.addEventListener('click', () => setSettingsOpen(false));
  newGameButton.addEventListener('click', () => { reset(); setSettingsOpen(false); });
  settingsPanel.addEventListener('pointerdown', e => e.stopPropagation());
  document.addEventListener('pointerdown', e => {
    if (settingsButton.getAttribute('aria-expanded') === 'true' && !settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) setSettingsOpen(false);
  });
  for (const input of [rowsInput, colsInput, enemiesInput]) input.addEventListener('input', applySettings);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setSettingsOpen(false); });

  syncSettings();
  buildBoard();
  updateStatus();
  new ResizeObserver(layout).observe(stage);
  window.addEventListener('sameyappearancechange', () => { orbCache.clear(); updateStatus(); requestDraw(); });
  new MutationObserver(() => { orbCache.clear(); updateStatus(); requestDraw(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-kb-theme','style']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { orbCache.clear(); updateStatus(); requestDraw(); });
  layout();
})();
</script>
</body>
</html>
