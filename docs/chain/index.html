/* Unified interaction language */
:root{
  --site-radius:8px;
  --site-radius-small:5px;
  --site-ease:cubic-bezier(.2,.8,.2,1);
  --site-ease-out:cubic-bezier(.16,1,.3,1);
  --site-ease-spring:cubic-bezier(.16,1,.3,1);
  --site-fast:110ms;
  --site-medium:190ms;
  --site-slow:280ms;
}
button,[role=button],.game-settings-action,.top-nav a,.compact-row,.card,.project{
  -webkit-tap-highlight-color:transparent;
}
button:not(:disabled),[role=button]:not([aria-disabled=true]){transition:background-color var(--site-fast) var(--site-ease-out),border-color var(--site-fast) var(--site-ease-out),color var(--site-fast) var(--site-ease-out),box-shadow var(--site-fast) var(--site-ease-out),opacity var(--site-fast) var(--site-ease-out)}
:focus-visible{outline:2px solid color-mix(in srgb,var(--site-accent,#787c7e) 72%,transparent);outline-offset:2px}

/* Sliders are deliberately chunky: the rail and knob share the same diameter. */
.game-settings-slider [data-kb-slider-track],
.game-settings-slider input[type=range]::-webkit-slider-runnable-track,
.game-settings-slider input[type=range]::-moz-range-track,
.game-settings-slider input[type=range]::-moz-range-progress{height:16px!important;border-radius:999px!important}
.game-settings-slider [data-kb-slider-track]{margin-inline:0!important;width:100%!important;overflow:visible;background:var(--color-secondary,var(--site-soft,#eee))!important}
.game-settings-slider [data-kb-slider-fill]{height:16px!important;border-radius:999px!important}
.game-settings-slider [role=slider],
.game-settings-slider input[type=range]::-webkit-slider-thumb,

.game-settings-slider [role=slider][data-orientation=horizontal]{top:50%!important;margin-top:-8px!important}
.game-settings-slider input[type=range]{height:16px!important;margin:0!important;width:100%!important}
.game-settings-slider input[type=range]::-webkit-slider-thumb{margin-top:0!important}

/* Pointer drags stay continuous even for coarse/discrete sliders. The control keeps its
   semantic stepped value underneath; only the visual thumb/fill follows the pointer until
   release, then eases to the selected step. Keyboard interaction remains natively stepped. */
.game-settings-slider[data-samey-slider-dragging] [role=slider]{
  transform:translateX(calc(-50% + var(--samey-slider-drag-offset,0px)))!important;
  transition:none!important;
}
.game-settings-slider[data-samey-slider-dragging] input[type=range]::-webkit-slider-thumb{
  transform:translateX(var(--samey-slider-drag-offset,0px));
  transition:none!important;
}
.game-settings-slider[data-samey-slider-dragging] input[type=range]::-moz-range-thumb{
  transform:translateX(var(--samey-slider-drag-offset,0px));
  transition:none!important;
}
.game-settings-slider[data-samey-slider-dragging] .game-range-fill,
.game-settings-slider[data-samey-slider-dragging] [data-kb-slider-fill]{
  width:var(--samey-slider-drag-fill)!important;
  transition:none!important;
}
.game-settings-slider[data-samey-slider-snapping] [role=slider]{
  transform:translateX(-50%)!important;
  transition:transform 130ms var(--site-ease-out)!important;
}
.game-settings-slider[data-samey-slider-snapping] input[type=range]::-webkit-slider-thumb{
  transform:translateX(0);
  transition:transform 130ms var(--site-ease-out)!important;

.game-settings-slider[data-samey-slider-snapping] [data-kb-slider-fill]{
  transition:width 130ms var(--site-ease-out)!important;
}

   jump relative to their anchor. */
