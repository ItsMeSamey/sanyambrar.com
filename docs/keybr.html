me is used to measure your learning progress. The more familiar you become with a letter, the less time it takes for you to type it.</p><p>Once you familiarize yourself with the entire current subset of letters, the algorithm expands it by adding more and more letters to the subset.</p>`,Zs=`<p>When the algorithm includes a new letter to the current subset, the frequency of this letter is artificially increased so that it will be included in every generated word of a lesson.</p><p>The algorithm can also artificially rearrange letter frequencies, placing an emphasis on the letters with the worst time-to-type metric.</p><p>This means you will always be typing the letters that you are least familiar with.</p>`,Qs=`<p>This is the text board. It displays the text to type out. The text changes for each new lesson. The text is generated automatically from the current subset of letters. Most of the words are not real, but are generated using the phonetic rules of your language so they sound natural and should be easy to pronounce. Besides being funny, this gives us the flexibility to use more words than actually exist.</p>`,$s=`<p>This is the virtual keyboard. It helps you memorize key positions. Use it to find the keys and try not to look at your physical keyboard. There are small bumps on the <em>F</em> and <em>J</em> keys of your keyboard. Use these to correctly position your index fingers without having to look at the keys. Once your index fingers are in the right position you will be able to locate the remainder of the keys.</p>`,ec=`<p>This is the typing speed indicator and the difference from the average value. Your goal is to increase this metric, meaning higher values are better.</p><p>Typing speed is measured in either <em>Words per Minute (WPM)</em> or <em>Characters per Minute (CPM)</em>. The definition of a word is standardized to be five characters, so <em>10WPM</em> is equal to <em>50CPM</em>.</p><p>You can switch between the <em>WPM</em> and the <em>CPM</em> display modes on the Settings page.</p>`,tc=`<p>This is the accuracy indicator and the difference from the average value. Your goal is to increase this metric, meaning higher values are better.</p><p>Accuracy is computed as the percentage of characters typed without errors. Many typos in the same position count as one error.</p>`,nc=`<p>This indicator shows the current subset of letters used to generate the lessons, and your confidence level for every letter in the subset:</p>`,rc=`<p>This indicator can also be used to predict the remaining number of lessons that are needed to fully unlock a letter, like in the example chart below. Visit it regularly to get more insight on how your learning is going, to see if you are making a progress.</p>`,ic=`<p>This indicator shows details about the letter with increased frequency, which is currently included in every generated word:</p><dl><dt>Best typing speed</dt><dd>Your best typing speed for this individual letter.</dd><dt>Confidence level</dt><dd>A number in range from zero to one which is computed using your typing speed, and indicates your familiarity with this letter. A letter is considered fully learned when it’s confidence level reaches one.</dd><dt>Learning rate</dt><dd>How your typing speed is changing with each lesson.</dd></dl>`,ac=`Accuracy`,oc=`Accuracy threshold`,sc=`All Time Statistics`,cc=`All keys`,lc=`All keys are unlocked.`,uc=`Average accuracy`,dc=`Average speed`,fc=`Average word length`,pc=`Books`,mc=`Caps Lock is on`,hc=`Characters per minute`,gc=`Characters per second`,_c=`Click or press Enter to activate...`,vc=`Close`,yc=`Colored keys`,bc=`Common words`,xc=`Current key`,Sc=`Custom text`,Cc=`Daily goal`,wc=`Done`,Tc=`Download data`,Ec=`Emulate layout`,Dc=`Explain charts`,Oc=`Explain settings`,kc=`Guided lessons`,Ac=`Hide explanations`,jc=`Highlight keys`,Mc=`Interface options`,Nc=`Keyboard`,Pc=`Keyboard hardware emulates layout`,Fc=`Last speed`,Ic=`Learning rate`,Lc=`Lesson options`,Rc=`Lessons`,zc=`Long words only`,Bc=`Metrics`,Vc=`Miscellaneous`,Hc=`Next`,Uc=`Not calibrated, need more samples.`,Wc=`Not set`,Gc=`Numbers`,Kc=`Options`,qc=`Prefer natural words`,Jc=`Preview`,Yc=`Previous`,Xc=`Remove punctuation characters`,Zc=`Reset`,Qc=`Reset statistics`,$c=`Score`,el=`Settings`,tl=`Shuffle words`,nl=`Source code`,rl=`Space skips words`,il=`Speed`,al=`Start date`,ol=`Statistics for Today`,sl=`Stop cursor on error`,cl=`Text appearance`,ll=`The previous keys are also above the target speed`,ul=`Time`,dl=`Top accuracy`,fl=`Top speed`,pl=`Transform to lowercase`,ml=`Typing`,hl=`Typing options`,gl=`Uncertain`,_l=`{value}/lesson`,vl=`Words per minute`,yl=`Words per second`,bl=`Digits`,xl=`Letters`,Sl=`Punctuation`,Cl=`Special`,wl=`Block cursor`,Tl=`Box cursor`,El=`Jumping cursor`,Dl=`Line cursor`,Ol=`Smooth cursor`,kl=`Underline cursor`,Al=`Daily goal reached!`,jl=`New letter unlocked!`,Ml=`Top score!`,Nl=`Top speed!`,Pl=`All words`,Fl=`Chapters`,Il=`Characters`,Ll=`Lessons`,Rl=`Paragraphs`,zl=`Unique words`,Bl=`Bar whitespace`,Vl=`Bullet whitespace`,Hl=`No whitespace`,Ul=`M|T|W|T|F|S|S`,Wl={"keyboard.emulation.forward.description":`Keyboard emulation ignores the keyboard layout configured in your system and allows you to practice the selected keyboard regardless of how your system is configured. It is more convenient to keep the emulation option enabled. If the above option is disabled (greyed out), this means the layout cannot be emulated (mainly for layouts which use dead keys).`,"keyboard.emulation.reverse.description":`Use this option if you have a hardware layout switcher on your keyboard, and you see that incorrect keys are highlighted on the virtual keyboard.`,"layouts.stats.bottomRowKeys.description":`The percentage of keys typed on the Shift row, the less the better.`,"layouts.stats.bottomRowKeys.name":`Keys on the bottom row:`,"layouts.stats.homeRowKeys.description":`The percentage of keys typed without leaving the Caps Lock row, the more the better.`,"layouts.stats.homeRowKeys.name":`Keys on the home row:`,"layouts.stats.sameFingerKeys.description":`The percentage of keys typed by the same finger, the less the better.`,"layouts.stats.sameFingerKeys.name":`Keys typed by the same finger:`,"layouts.stats.sameHandKeys.description":`The percentage of keys typed by the same hand, the less the better.`,"layouts.stats.sameHandKeys.name":`Keys typed by the same hand:`,"layouts.stats.topRowKeys.description":`The percentage of keys typed on the Tab row, the less the better.`,"layouts.stats.topRowKeys.name":`Keys on the top row:`,"learningRate.alreadyUnlocked":`This letter is already unlocked.`,"learningRate.remainingLessons":`Approximately {remainingLessons} lessons remaining to unlock the next letter ({certainty} certainty).`,"learningRate.unknown":`Need more data to compute the remaining lessons to unlock this letter.`,"lesson.indicator.focused":`A key with increased frequency. It takes you the most time to find this key so the algorithm chose it to be included in every generated word.`,"lesson.indicator.forced":`A key which was manually included in the lessons.`,"lesson.indicator.leastConfidence":`A calibrated key with the lowest confidence level. The more times you press this key, the more accurate this metric becomes.`,"lesson.indicator.mostConfidence":`A calibrated key with the highest confidence level. The more times you press this key, the more accurate this metric becomes.`,"lesson.indicator.notCalibrated":`A non-calibrated key with an unknown confidence level. You still have not pressed this key yet.`,"lesson.indicator.notIncluded":`A key which was not yet included in the lessons.`,"lessonType.books.description":`Generate typing lessons from the text of a book. All keys are included by default. This mode is for the pros.`,"lessonType.code.description":`Practice punctuation characters that are specific to a programming language syntax.`,"lessonType.customText.description":`Generate typing lessons from the words of your own custom text. All keys are included by default. This mode is for the pros.`,"lessonType.guided.description":`Generate typing lessons with random words using the phonetic rules of your language. The key set is expanded dynamically based on your performance. This mode is for the beginners.`,"lessonType.numbers.description":`Practice numbers only.`,"lessonType.syntax.description":`Generate lessons that resemble the specified programming language syntax.`,"lessonType.wordList.description":`Generate typing lessons from the list of the most common words of your language. All keys are included by default. This mode is for the pros.`,m_tour01:Js,m_tour02:Ys,m_tour03:Xs,m_tour04:Zs,m_tour05:Qs,m_tour06:$s,m_tour07:ec,m_tour08:tc,m_tour10:nc,m_tour11:rc,m_tour12:ic,"metric.accuracy.description":`The percentage of characters typed without errors in the last lesson.`,"metric.difference.description":`The difference from the average value.`,"metric.score.description":`Score of the last lesson in abstract points. Scores are greater when you type faster and with fewer errors.`,"metric.speed.description":`Typing speed in the last lesson.`,"practice.widget.resetLesson.description":`Reset the current lesson (Ctrl + Left Arrow).`,"practice.widget.settings.description":`Change lesson settings, configure language, keyboard layout, etc.`,"practice.widget.showTour.description":`Show a guided tour with help slides.`,"practice.widget.skipLesson.description":`Skip the current lesson (Ctrl + Right Arrow).`,"practice.widget.switchView.description":`Switch the current interface layout.`,"setting.keyboardOrder.description":`Sort letters in such a way that the letters from the home row come first, then the letters from the top row, and finally all the remaining letters. Home row is the row with the CapsLock key. Top row is the row with the Tab key. It is easier and faster to type when your fingers do not need to move away from the home row. This feature works best with optimized layouts, like cription":`Adjust the number of words in the lesson text. Making lessons longer can improve your learning.`,"settings.naturalWords.description":`Use the dictionary words as much as possible, and if not many such words are available, then use computer-generated pseudo-words. Natural words might be easier to type. Pseudo-words offer a much greater variety of letter combinations. If this option is enabled, you will see more pseudo-words in the beginning, when the letter list is short. However, as you unlock few more letters, there is a good chance that only the dictionary words will be used.`,"settings.punctuation.description":`Adjust the amount of basic punctuation characters added to the lesson text. Use this option to practice typing the punctuation characters. We recommend to increase this value only if you have all letters above the target speed.`,"settings.recoverKeys.description":`When you focus on a new key, it is very likely that the speed of previous keys will decrease. If this option is disabled, you unlock a new key by raising only the focused key above the target speed. If this option is enabled, you will have to raise the focused key and all the previous keys above the target speed. This will make unlocking new keys harder. However, this will also make forgetting old keys harder.`,"settings.repeatWords.description":`Repeat each word a number of times. Type a word for the first time to develop your muscle memory. Typing the same word consecutively should be easier.`,"settings.spaceSkipsWords.description":`If enabled, pressing the space key in the middle of a word will skip the remaining characters of the word and position cursor at the beginning of the next word.`,"settings.stopCursorOnError.description":`If enabled, the text cursor stops advancing until the right key is pressed at the current position. If disabled, all errors will be accumulated in the text input field and must be cleared with the delete key.`,"settings.targetSpeed.description":`The targe Did gyre and gimble in the wabe;

And the mome raths outgrabe.

"Beware the Jabberwock, my son!
The jaws that bite, the claws that catch!
Beware the Jubjub bird, and shun
The frumious Bandersnatch!"

Long time the manxome foe he sought-
So rested he by the Tumtum tree,
And stood awhile in thought.

The Jabberwock, with eyes of flame,
Came whiffling through the tulgey wood,
And burbled as it came!

One, two! One, two! and through and through
The vorpal blade went snicker-snack!
He left it dead, and with its head
He went galumphing back.

Come to my arms, my beamish boy!
O frabjous day! Callooh! Callay!"
