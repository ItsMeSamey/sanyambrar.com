become with a letter, the less time it takes for you to type it.</p><p>Once you familiarize yourself with the entire current subset of letters, the algorithm expands it by adding more and more letters to the subset.</p>`,Za=`<p>When the algorithm includes a new letter to the current subset, the frequency of this letter is artificially increased so that it will be included in every generated word of a lesson.</p><p>The algorithm can also artificially rearrange letter frequencies, placing an emphasis on the letters with the worst time-to-type metric.</p><p>This means you will always be typing the letters that you are least familiar with.</p>`,Qa=`<p>This is the text board. It displays the text to type out. The text changes for each new lesson. The text is generated automatically from the current subset of letters. Most of the words are not real, but are generated using the phonetic rules of your language so they sound natural and should be easy to pronounce. Besides being funny, this gives us the flexibility to use more words than actually exist.</p>`,$a=`<p>This is the virtual keyboard. It helps you memorize key positions. Use it to find the keys and try not to look at your physical keyboard. There are small bumps on the <em>F</em> and <em>J</em> keys of your keyboard. Use these to correctly position your index fingers without having to look at the keys. Once your index fingers are in the right position you will be able to locate the remainder of the keys.</p>`,eo=`<p>This is the typing speed indicator and the difference from the average value. Your goal is to increase this metric, meaning higher values are better.</p><p>Typing speed is measured in either <em>Words per Minute (WPM)</em> or <em>Characters per Minute (CPM)</em>. The definition of a word is standardized to be five characters, so <em>10WPM</em> is equal to <em>50CPM</em>.</p><p>You can switch between the <em>WPM</em> and the <em>CPM</em> display modes on the Settings page.</p>`,to=`<p>This is the accuracy indicator and the difference from the average value. Your goal is to increase this metric, meaning higher values are better.</p><p>Accuracy is computed as the percentage of characters typed without errors. Many typos in the same position count as one error.</p>`,no=`<p>This indicator shows the current subset of letters used to generate the lessons, and your confidence level for every letter in the subset:</p>`,ro=`<p>This indicator can also be used to predict the remaining number of lessons that are needed to fully unlock a letter, like in the example chart below. Visit it regularly to get more insight on how your learning is going, to see if you are making a progress.</p>`,io=`<p>This indicator shows details about the letter with increased frequency, which is currently included in every generated word:</p><dl><dt>Best typing speed</dt><dd>Your best typing speed for this individual letter.</dd><dt>Confidence level</dt><dd>A number in range from zero to one which is computed using your typing speed, and indicates your familiarity with this letter. A letter is considered fully learned when it’s confidence level reaches one.</dd><dt>Learning rate</dt><dd>How your typing speed is changing with each lesson.</dd></dl>`,ao=`Accuracy`,oo=`Accuracy threshold`,so=`All Time Statistics`,co=`All keys`,lo=`All keys are unlocked.`,uo=`Average accuracy`,fo=`Average speed`,po=`Average word length`,mo=`Books`,ho=`Caps Lock is on`,go=`Characters per minute`,_o=`Characters per second`,vo=`Click or press Enter to activate...`,yo=`Close`,bo=`Colored keys`,xo=`Common words`,So=`Current key`,Co=`Custom text`,wo=`Daily goal`,To=`Done`,Eo=`Download data`,Do=`Emulate layout`,Oo=`Explain charts`,ko=`Explain settings`,Ao=`Guided lessons`,jo=`Hide explanations`,Mo=`Highlight keys`,No=`Interface options`,Po=`Keyboard`,Fo=`Keyboard hardware emulates layout`,Io=`Last speed`,Lo=`Learning rate`,Ro=`Lesson options`,zo=`Lessons`,Bo=`Long words only`,Vo=`Metrics`,Ho=`Miscellaneous`,Uo=`Next`,Wo=`Not c sons longer can improve your learning.`,"settings.naturalWords.description":`Use the dictionary words as much as possible, and if not many such words are available, then use computer-generated pseudo-words. Natural words might be easier to type. Pseudo-words offer a much greater variety of letter combinations. If this option is enabled, you will see more pseudo-words in the beginning, when the letter list is short. However, as you unlock few more letters, there is a good chance that only the dictionary words will be used.`,"settings.punctuation.description":`Adjust the amount of basic punctuation characters added to the lesson text. Use this option to practice typing the punctuation characters. We recommend to increase this value only if you have all letters above the target speed.`,"settings.recoverKeys.description":`When you focus on a new key, it is very likely that the speed of previous keys will decrease. If this option is disabled, you unlock a new key by raising only the focused key above the target speed. If this option is enabled, you will have to raise the focused key and all the previous keys above the target speed. This will make unlocking new keys harder. However, this will also make forgetting old keys harder.`,"settings.repeatWords.description":`Repeat each word a number of times. Type a word for the first time to develop your muscle memory. Typing the same word consecutively should be easier.`,"settings.spaceSkipsWords.description":`If enabled, pressing the space key in the middle of a word will skip the remaining characters of the word and position cursor at the beginning of the next word.`,"settings.stopCursorOnError.description":`If enabled, the text cursor stops advancing until the right key is pressed at the current position. If disabled, all errors will be accumulated in the text input field and must be cleared with the delete key.`,"settings.targetSpeed.description":`The target speed is used to measure the confidence level and the color of a letter. The closer to the target speed, the greener. In the guided mode a letter is only unlocked when you pass a target speed threshold. When you unlock all letters, you can increase the target speed to go back to the learning mode and unlock the letters again, this time with a higher speed threshold. We recommend to increase the target speed in modest steps only when you have all letters above the target speed.`,"settings.typingAssists.description":`These are the typing assists which help your preserve your concentration and keep the flow by automatically correcting your errors.`,"settings.typingSpeedUnit.description":`For the purpose of typing measurement, each word is standardized to be five characters or keystrokes in English, including spaces and punctuation.`,"stats.accuracy.header":`Accuracy Streaks`,"stats.accuracy.legend":`Above are listed the longest continuous sequences of lessons with accuracy above a given threshold, along with statistics about every such sequence. The longer the sequence of lessons, the better.`,"stats.accuracy.noData":`You don’t have any accuracy streaks. Consider completing a lesson with a highest accuracy possible, regardless of typing speed.`,"stats.chart.calendar.caption":`Practice Calendar`,"stats.chart.calendar.description":`This calendar shows the dates of active learning.`,"stats.chart.keyFrequencyHeatmap.caption":`Key Frequency Heatmap`,"stats.chart.keyFrequencyHeatmap.description":`This chart shows relative key frequencies as a heatmap.`,"stats.chart.keyFrequencyHeatmap.legend":`Circle color: {label1} – hit count, {label2} – miss count.`,"stats.chart.keyFrequencyHistogram.caption":`Key Frequency Histogram`,"stats.chart.keyFrequencyHistogram.description":`This chart shows relative key frequencies.`,"stats.chart.keyFrequencyHistogram.legend":`Bar color: {label1} – hit count, {label2} – miss count, {label3} – miss/hit ratio (relative miss frequency).`,"stats.chart.keySpeed.caption":`Key Typing Speed`,"stats.chart.keySpeed.descr The vorpal blade went snicker-snack!

He went galumphing back.

O frabjous day! Callooh! Callay!"
