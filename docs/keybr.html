ontrolled by the algorithm, which provides you with the best learning experience.</p>`,Zs=`<p>Initially it starts generating words from a small subset of the most frequent letters in the alphabet.</p><p>When you are typing these words, the application measures the time-to-type metric for every letter in that subset. This time is used to measure your learning progress. The more familiar you become with a letter, the less time it takes for you to type it.</p><p>Once you familiarize yourself with the entire current subset of letters, the algorithm expands it by adding more and more letters to the subset.</p>`,Qs=`<p>When the algorithm includes a new letter to the current subset, the frequency of this letter is artificially increased so that it will be included in every generated word of a lesson.</p><p>The algorithm can also artificially rearrange letter frequencies, placing an emphasis on the letters with the worst time-to-type metric.</p><p>This means you will always be typing the letters that you are least familiar with.</p>`,$s=`<p>This is the text board. It displays the text to type out. The text changes for each new lesson. The text is generated automatically from the current subset of letters. Most of the words are not real, but are generated using the phonetic rules of your language so they sound natural and should be easy to pronounce. Besides being funny, this gives us the flexibility to use more words than actually exist.</p>`,ec=`<p>This is the virtual keyboard. It helps you memorize key positions. Use it to find the keys and try not to look at your physical keyboard. There are small bumps on the <em>F</em> and <em>J</em> keys of your keyboard. Use these to correctly position your index fingers without having to look at the keys. Once your index fingers are in the right position you will be able to locate the remainder of the keys.</p>`,tc=`<p>This is the typing speed indicator and the difference from the average value. Your goal is to increase this metric, meaning higher values are better.</p><p>Typing speed is measured in either <em>Words per Minute (WPM)</em> or <em>Characters per Minute (CPM)</em>. The definition of a word is standardized to be five characters, so <em>10WPM</em> is equal to <em>50CPM</em>.</p><p>You can switch between the <em>WPM</em> and the <em>CPM</em> display modes on the Settings page.</p>`,nc=`<p>This is the accuracy indicator and the difference from the average value. Your goal is to increase this metric, meaning higher values are better.</p><p>Accuracy is computed as the percentage of characters typed without errors. Many typos in the same position count as one error.</p>`,rc=`<p>This indicator shows the current subset of letters used to generate the lessons, and your confidence level for every letter in the subset:</p>`,ic=`<p>This indicator can also be used to predict the remaining number of lessons that are needed to fully unlock a letter, like in the example chart below. Visit it regularly to get more insight on how your learning is going, to see if you are making a progress.</p>`,ac=`<p>This indicator shows details about the letter with increased frequency, which is currently included in every generated word:</p><dl><dt>Best typing speed</dt><dd>Your best typing speed for this individual letter.</dd><dt>Confidence level</dt><dd>A number in range from zero to one which is computed using your typing speed, and indicates your familiarity with this letter. A letter is considered fully learned when it’s confidence level reaches one.</dd><dt>Learning rate</dt><dd>How your typing speed is changing with each lesson.</dd></dl>`,oc=`Accuracy`,sc=`Accuracy threshold`,cc=`All Time Statistics`,lc=`All keys`,uc=`All keys are unlocked.`,dc=`Average accuracy`,fc=`Average speed`,pc=`Average word length`,mc=`Books`,hc=`Caps Lock is on`,gc=`Characters per minute`,_c=`Characters per second`,vc=`Click or press Enter to activate...`,yc=`Close`,bc=`Colored keys`,xc=`Common words`,Sc=`Current key`,Cc=`Custom text`,wc=`Daily goal`,Tc=`Done`,Ec=`Download data`,Dc=`Emulate layout`,Oc=`Explain charts`,kc=`Explain settings`,Ac=`Guided lessons`,jc=`Hide explanations`,Mc=`Highlight keys`,Nc=`Interface options`,Pc=`Keyboard`,Fc=`Keyboard hardware emulates layout`,Ic=`Last speed`,Lc=`Learning rate`,Rc=`Lesson options`,zc=`Lessons`,Bc=`Long words only`,Vc=`Metrics`,Hc=`Miscellaneous`,Uc=`Next`,Wc=`Not calibrated, need more samples.`,Gc=`Not set`,Kc=`Numbers`,qc=`Options`,Jc=`Prefer natural words`,Yc=`Preview`,Xc=`Previous`,Zc=`Remove punctuation characters`,Qc=`Reset`,$c=`Reset statistics`,el=`Score`,tl=`Settings`,nl=`Shuffle words`,rl=`Source code`,il=`Space skips words`,al=`Speed`,ol=`Start date`,sl=`Statistics for Today`,cl=`Stop cursor on error`,ll=`Text appearance`,ul=`The previous keys are also above the target speed`,dl=`Time`,fl=`Top accuracy`,pl=`Top speed`,ml=`Transform to lowercase`,hl=`Typing`,gl=`Typing options`,_l=`Uncertain`,vl=`{value}/lesson`,yl=`Words per minute`,bl=`Words per second`,xl=`Digits`,Sl=`Letters`,Cl=`Punctuation`,wl=`Special`,Tl=`Block cursor`,El=`Box cursor`,Dl=`Jumping cursor`,Ol=`Line cursor`,kl=`Smooth cursor`,Al=`Underline cursor`,jl=`Daily goal reached!`,Ml=`New letter unlocked!`,Nl=`Top score!`,Pl=`Top speed!`,Fl=`All words`,Il=`Chapters`,Ll=`Characters`,Rl=`Lessons`,zl=`Paragraphs`,Bl=`Unique words`,Vl=`Bar whitespace`,Hl=`Bullet whitespace`,Ul=`No whitespace`,Wl=`M|T|W|T|F|S|S`,Gl={"keyboard.emulation.forward.description":`Keyboard emulation ignores the keyboard layout configured in your system and allows you to practice the selected keyboard regardless of how your system is configured. It is more convenient to keep the emulation option enabled. If the above option is disabled (greyed out), this means the layout cannot be emulated (mainly for layouts which use dead keys).`,"keyboard.emulation.reverse.description":`Use this option if you have a hardware layout switcher on your keyboard, and you see that incorrect keys are highlighted on the virtual keyboard.`,"layouts.stats.bottomRowKeys.description":`The percentage of keys typed on the Shift row, the less the better.`,"layouts.stats.bottomRowKeys.name":`Keys on the bottom row:`,"layouts.stats.homeRowKeys.description":`The percentage of keys typed without leaving the Caps Lock row, the more the better.`,"layouts.stats.homeRowKeys.name":`Keys on the home row:`,"layouts.stats.sameFingerKeys.description":`The percentage of keys typed by the same finger, the less the better.`,"layouts.stats.sameFingerKeys.name":`Keys typed by the same finger:`,"layouts.stats.sameHandKeys.description":`The percentage of keys typed by the same hand, the less the better.`,"layouts.stats.sameHandKeys.name":`Keys typed by the same hand:`,"layouts.stats.topRowKeys.description":`The percentage of keys typed on the Tab row, the less the better.`,"layouts.stats.topRowKeys.name":`Keys on the top row:`,"learningRate.alreadyUnlocked":`This letter is already unlocked.`,"learningRate.remainingLessons":`Approximately {remainingLessons} lessons remaining to unlock the next letter ({certainty} certainty).`,"learningRate.unknown":`Need more data to compute the remaining lessons to unlock this letter.`,"lesson.indicator.focused":`A key with increased frequency. It takes you the most time to find this key so the algorithm chose it to be included in every generated word.`,"lesson.indicator.forced":`A key which was manually included in the lessons.`,"lesson.indicator.leastConfidence":`A calibrated key with the lowest confidence level. The more times you press this key, the more accurate this metric becomes.`,"lesson.indicator.mostConfidence":`A calibrated key with the highest confidence level. The more times you press this key, the more accurate this metric becomes.`,"lesson.indicator.notCalibrated":`A non-calibrated key with an unknown confidence level. You still have not pressed this key yet.`,"lesson.indicator.notIncluded":`A key which was not yet included in the lessons.`,"lessonType.books.description":`Generate typing lessons from the text of a book. All keys are included by default. This mode is for the pros.`,"lessonType.code.description":`Practice punctuation characters that are specific to a programming language syntax.`,"lessonType.customText.description":`Generate typing lessons from the words of your own custom text. All keys are included by default. This mode is for the pros.`,"lessonType.guided.description":`Generate typing lessons with random words using the phonetic rules of your language. The key set is expanded dynamically based on your performance. This mode is for the beginners.`,"lessonType.numbers.description":`Practice numbers only.`,"lessonType.syntax.description":`Generate lessons that resemble the specified programming language syntax.`,"lessonType.wordList.description":`Generate typing lessons from the list of the most common words of your language. All keys are included by default. This mode is for the pros.`,m_tour01:Ys,m_tour02:Xs,m_tour03:Zs,m_tour04:Qs,m_tour05:$s,m_tour06:ec,m_tour07:tc,m_tour08:nc,m_tour10:rc,m_tour11:ic,m_tour12:ac,"metric.accuracy.description":`The percentage of characters typed without errors in the last lesson.`,"metric.difference.description":`The difference from the average value.`,"metric.score.description":`Score of the last lesson in abstract points. Scores are greater when you type faster and with fewer errors.`,"metric.speed.description":`Typing speed in the last lesson.`,"practice.widget.resetLesson.description":`Reset the current lesson (Ctrl + Left Arrow).`,"practice.widget.settings.description":`Change lesson settings, configure language, keyboard layout, etc.`,"practice.widget.showTour.description":`Show a guided tour with help slides.`,"practice.widget.skipLesson.description":`Skip the current lesson (Ctrl + Right Arrow).`,"practice.widget.switchView.description":`Switch the current interface layout.`,"setting.keyboardOrder.description":`Sort letters in such a way that the letters from the home row come first, then the letters from the top row, and finally all the remaining letters. Home row is the row with the CapsLock key. Top row is the row with the Tab key. It is easier and faster to type when your fingers do not need to move away from the home row. This feature works best with optimized layouts, like Dvorak or Colemak. In the Qwerty layout, the only vowel on the home row is A, so it severely limits the choice of words, and the algorithm will use more pseudo-words than usual.`,"setting.keyboardOrder.label":`Sort letters in the order of keyboard keys`,"settings.alphabetSize.description":`Manually unlock the remaining letters. Use this option if want a greater variety of words. We recommend using this option sparingly and stick to the algorithm to unlock letters for you.`,"settings.benfordsLaw.description":`<a>Benford’s law</a> is an observation that in many real-life numerical data sets, the leading digit is likely to be small.`,"settings.benfordsLaw.label":`Benford’s law`,"settings.capitalLetters.description":`Adjust the amount of capital letters added to the lesson text. Use this option to practice typing the capital letters. We recommend to increase this value only if you have all letters above the target speed.`,"settings.customTextLettersOnly.description":`Remove punctuation from the text to make it simpler to type.`,"settings.customTextLowercase.description":`Transform all text to lower case to make it simpler to type.`,"settings.customTextRandomize.description":`Put words from the custom text in a random order.`,"settings.dailyGoal.description":`Set the time you want to spend on the exercises daily. It is a simple reminder which does not limit you in any way. You can stop practicing whenever you want.`,"settings.forgiveErrors.description":`If enabled, the text input field will forgive some kinds of errors by automatically fixing them. These are errors such as typing a wrong character or skipping a character.`,"settings.keyboardColors.description":`Show color coding of the keyboard zones. Use this option to learn which finger to use to press a key.`,"settings.keyboardPointers.description":`Highlight a key that must to be pressed next. Use this option to quickly find the position of a key if you don’t know the keyboard layout well.`,"settings.lessonLength.description":`Adjust the number of words in the lesson text. Making lessons longer can improve your learning.`,"settings.naturalWords.description":`Use the dictionary words as much as possible, and if not many such words are available, then use computer-generated pseudo-words. Natural words might be easier to type. Pseudo-words offer a much greater variety of letter combinations. If this option is enabled, you will see more pseudo-words in the beginning, when the letter list is short. However, as you unlock few more letters, there is a good chance that only the dictionary words will be used.`,"settings.punctuation.description":`Adjust the amount of basic punctuation characters added to the lesson text. Use this option to practice typing the punctuation characters. We recommend to increase this value only if you have all letters above the target speed.`,"settings.recoverKeys.description":`When you focus on a new key, it is very likely that the speed of previous keys will decrease. If this option is disabled, you unlock a new key by raising only the focused key above the target speed. If this option is enabled, you will have to raise the focused key and all the previous keys above the target speed. This will make unlocking new keys harder. However, this will also make forgetting old keys harder.`,"settings.repeatWords.description":`Repeat each word a number of times. Type a word for the first time to develop your muscle memory. Typing the same word consecutively should be easier.`,"settings.spaceSkipsWords.description":`If enabled, pressing the space key in the middle of a word will skip the remaining characters of the word and position cursor at the beginning of the next word.`,"settings.stopCursorOnError.description":`If enabled, the text cursor stops advancing until the right key is pressed at the current position. If disabled, all errors will be accumulated in the text input field and must be cleared with the delete key.`,"settings.targetSpeed.description":`The target speed is used to measure the confidence level and the color of a letter. The closer to the target speed, the greener. In the guided mode a letter is only unlocked when you pass a target speed threshold. When you unlock all letters, you can increase the target speed to go back to the learning mode and unlock the letters again, this time with a higher speed threshold. We recommend to increase the target speed in modest steps only when you have all letters above the target speed.`,"settings.typingAssists.description":`These are the typing assists which help your preserve your concentration and keep the flow by automatically correcting your errors.`,"settings.typingSpeedUnit.description":`For the purpose of typing measurement, each word is standardized to be five characters or keystrokes in English, including spaces and punctuation.`,"stats.accuracy.header":`Accuracy Streaks`,"stats.accuracy.legend":`Above are listed the longest continuous sequences of lessons with accuracy above a given threshold, along with statistics about every such sequence. The longer the sequence of lessons, the better.`,"stats.accuracy.noData":`You don’t have any accuracy streaks. Consider completing a lesson with a highest accuracy possible, regardless of typing speed.`,"stats.chart.calendar.caption":`Practice Calendar`,"stats.chart.calendar.description":`This calendar shows the dates of active learning.`,"stats.chart.keyFrequencyHeatmap.caption":`Key Frequency Heatmap`,"stats.chart.keyFrequencyHeatmap.description":`This chart shows relative key frequencies as a heatmap.`,"stats.chart.keyFrequencyHeatmap.legend":`Circle color: {label1} – hit count, {label2} – miss count.`," 'Twas brillig, and the slithy toves
Did gyre and gimble in the wabe;
All mimsy were the borogoves,
And the mome raths outgrabe.

"Beware the Jabberwock, my son!
The jaws that bite, the claws that catch!
Beware the Jubjub bird, and shun
The frumious Bandersnatch!"

He took his vorpal sword in hand:
Long time the manxome foe he sought-
So rested he by the Tumtum tree,
And stood awhile in thought.

And as in uffish thought he stood,
The Jabberwock, with eyes of flame,
Came whiffling through the tulgey wood,
And burbled as it came!

One, two! One, two! and through and through
The vorpal blade went snicker-snack!
He left it dead, and with its head
He went galumphing back.

"And hast thou slain the Jabberwock?
Come to my arms, my beamish boy!
O frabjous day! Callooh! Callay!"
