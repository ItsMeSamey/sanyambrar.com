<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Markdown Renderer</title>
	
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<style>
		:root {
			--bg: #09090b;
			--fg: #fafafa;
			--muted: #a1a1aa;
			--border: #27272a;
			--accent: #fb9266;
			--code-bg: #18181b;
			
			--font-size: 15px;
			--max-width: 768px;
			--line-height: 1.6;
		}

		* { box-sizing: border-box; outline: none; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background-color: var(--bg);
			color: var(--fg);
			margin: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 100vh;
			font-size: var(--font-size);
			line-height: var(--line-height);
		}

		/* Drop Zone */
		#drop-zone {
			position: fixed; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			background: var(--bg); z-index: 10;
			transition: opacity 0.2s;
		}
		
		#drop-zone.hidden { opacity: 0; pointer-events: none; }

		.drop-content {
			text-align: center; padding: 40px;
			border: 1px dashed var(--border);
			border-radius: 8px; color: var(--muted);
			cursor: pointer; transition: 0.2s;
		}

		.drop-content:hover { border-color: var(--fg); color: var(--fg); }
		.drop-content i { font-size: 32px; margin-bottom: 12px; }

		/* Chat Area */
		#chat-container {
			width: 100%; flex-grow: 1;
			padding-bottom: 80px; opacity: 0;
			transition: opacity 0.3s;
		}
		#chat-container.visible { opacity: 1; }

		.message-row {
			width: 100%; padding: 2rem 0;
			border-bottom: 1px solid var(--border);
		}

		.message-content {
			max-width: var(--max-width);
			margin: 0 auto; display: flex; gap: 24px;
			padding: 0 24px;
		}

		.avatar {
			width: 24px; height: 24px;
			border-radius: 4px; flex-shrink: 0;
			display: flex; align-items: center; justify-content: center;
			font-size: 12px; font-weight: 600;
			border: 1px solid var(--border);
		}
		.user .avatar { background: var(--bg); color: var(--muted); }
		.model .avatar { background: var(--fg); color: var(--bg); }

		/* Markdown Styling */
		.markdown-text { width: 100%; overflow-wrap: break-word; }
		.markdown-text > *:first-child { margin-top: 0; }
		.markdown-text > *:last-child { margin-bottom: 0; }
		
		/* Grok-like Hints */
		.markdown-text h1, .markdown-text h2, .markdown-text h3 { color: var(--fg); font-weight: 600; letter-spacing: -0.02em; }
		.markdown-text strong { color: var(--accent); font-weight: 600; }
		.markdown-text a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
		.markdown-text blockquote { border-left: 2px solid var(--border); padding-left: 1rem; color: var(--muted); }
		
		.markdown-text pre {
			background: var(--code-bg); padding: 16px;
			border-radius: 6px; overflow-x: auto;
			margin: 16px 0; border: 1px solid var(--border);
		}

		.markdown-text code {
			font-family: 'Geist Mono', 'Consolas', monospace;
			font-size: 0.85em; color: var(--fg);
		}
		
		.markdown-text :not(pre) > code {
			background: var(--border); padding: 2px 4px;
			border-radius: 4px; color: #e4e4e7;
		}

		/* Controls */
		.fab-container {
			position: fixed; bottom: 24px; right: 24px;
			display: flex; gap: 12px; z-index: 100;
		}

		.btn {
			width: 40px; height: 40px;
			border-radius: 6px; background: var(--bg);
			color: var(--fg); border: 1px solid var(--border);
			cursor: pointer; display: flex;
			align-items: center; justify-content: center;
			font-size: 16px; transition: 0.1s;
		}
		.btn:hover { background: var(--border); }

		/* Settings Modal */
		#settings-modal {
			position: fixed; top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			background: var(--bg); padding: 24px;
			border-radius: 8px; border: 1px solid var(--border);
			width: 320px; z-index: 200; opacity: 0;
			pointer-events: none; transition: 0.1s;
		}
		#settings-modal.open { opacity: 1; pointer-events: auto; }

		#overlay {
			position: fixed; inset: 0;
			background: rgba(0,0,0,0.5); z-index: 150;
			opacity: 0; pointer-events: none;
			transition: 0.1s; backdrop-filter: blur(1px);
		}
		#overlay.open { opacity: 1; pointer-events: auto; }

		.setting-group { margin-bottom: 20px; }
		.setting-group label { 
			display: flex; justify-content: space-between; 
			margin-bottom: 8px; font-size: 13px; color: var(--muted); 
		}
		
		/* Range Slider */
		input[type="range"] {
			width: 100%; height: 4px; border-radius: 2px;
			background: var(--border); outline: none;
			appearance: none; cursor: pointer;
		}
		input[type="range"]::-webkit-slider-thumb {
			appearance: none; width: 16px; height: 16px;
			border-radius: 50%; background: var(--fg);
			border: 2px solid var(--bg);
		}

		.hidden { display: none !important; }
		input[type="file"] { display: none; }
	</style>
</head>
<body>

	<div id="drop-zone">
		<div class="drop-content" onclick="document.getElementById('fileInput').click()">
			<i class="fa-solid fa-file-code"></i>
			<div style="font-size: 14px;">Select JSON or TXT</div>
		</div>
	</div>

	<input type="file" id="fileInput" accept=".txt,.json,.md">

	<div id="chat-container"></div>

	<div class="fab-container hidden" id="fab-controls">
		<button class="btn" onclick="toggleSettings()"><i class="fa-solid fa-sliders"></i></button>
		<button class="btn" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-plus"></i></button>
	</div>

	<div id="overlay" onclick="toggleSettings()"></div>
	<div id="settings-modal">
		<div class="setting-group">
			<label><span>Width</span> <span id="width-val">768px</span></label>
			<input type="range" min="600" max="1400" step="10" value="768" oninput="updateSetting('width', this.value)">
		</div>
		<div class="setting-group">
			<label><span>Size</span> <span id="font-val">15px</span></label>
			<input type="range" min="12" max="20" step="1" value="15" oninput="updateSetting('font', this.value)">
		</div>
		<div class="setting-group">
			<label><span>Line Height</span> <span id="lh-val">1.6</span></label>
			<input type="range" min="1.3" max="2.0" step="0.1" value="1.6" oninput="updateSetting('lh', this.value)">
		</div>
	</div>

<script>
	marked.setOptions({
		highlight: (code, lang) => {
			const language = highlight.getLanguage(lang) ? lang : 'plaintext';
			return highlight.highlight(code, { language }).value;
		}
	});

	const fileInput = document.getElementById('fileInput');
	const dropZone = document.getElementById('drop-zone');
	const chatContainer = document.getElementById('chat-container');
	const fabControls = document.getElementById('fab-controls');
	const root = document.documentElement;

	fileInput.addEventListener('change', (e) => {
		if (e.target.files[0]) loadFile(e.target.files[0]);
		e.target.value = ''; 
	});

	// Drag & Drop
	document.addEventListener('dragover', (e) => e.preventDefault());
	document.addEventListener('drop', (e) => {
		e.preventDefault();
		if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
	});

	function loadFile(file) {
		const reader = new FileReader();
		reader.onload = (e) => processContent(e.target.result);
		reader.readAsText(file);
	}

	function processContent(text) {
		try {
			let clean = text.trim();
			if (clean.startsWith('---')) clean = clean.substring(3).trim();
			clean = clean.replace(/,(\s*[}\]])/g, '$1'); // Fix trailing commas

			const data = JSON.parse(clean);
			if (!Array.isArray(data)) throw new Error("Not an array");

			renderChat(data);
			
			dropZone.classList.add('hidden');
			chatContainer.classList.add('visible');
			fabControls.classList.remove('hidden');
		} catch (err) {
			alert("Parse Error: " + err.message);
		}
	}

	function renderChat(messages) {
		chatContainer.innerHTML = '';
		messages.forEach(msg => {
			const role = msg.role || 'unknown';
			const html = msg.text ? marked.parse(msg.text) : '<i>Empty</i>';
			const row = document.createElement('div');
			
			row.className = `message-row ${role}`;
			row.innerHTML = `
				<div class="message-content">
					<div class="avatar">${role === 'user' ? 'USR' : 'AI'}</div>
					<div class="markdown-text">${html}</div>
				</div>
			`;
			chatContainer.appendChild(row);
		});
		window.scrollTo(0, 0);
	}

	function toggleSettings() {
		document.getElementById('settings-modal').classList.toggle('open');
		document.getElementById('overlay').classList.toggle('open');
	}

	function updateSetting(type, val) {
		const map = {
			'width': { var: '--max-width', unit: 'px' },
			'font': { var: '--font-size', unit: 'px' },
			'lh': { var: '--line-height', unit: '' }
		};
		const conf = map[type];
		root.style.setProperty(conf.var, val + conf.unit);
		document.getElementById(`${type}-val`).textContent = val + conf.unit;
	}
</script>
</body>
</html>
