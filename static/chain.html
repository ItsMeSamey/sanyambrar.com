<!doctype html>
<html lang="en" data-spa data-home-href="./" data-site-kind="chain">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
  <title>Chain Reaction · Sanyam Brar</title>
  <script src="./appearance.generated.js"></script>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./site.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--site-bg,#fff);color:var(--site-fg,#121213);font-family:var(--site-font,Arial,Helvetica,sans-serif)}
    button,input{font:inherit;color:inherit}
    .chain-shell{position:relative;height:100dvh;background:var(--site-bg,#fff)}
    .chain-stage{position:absolute;inset:0;min-width:0;min-height:0;display:grid;place-items:center;padding:58px 18px 18px;overflow:hidden;touch-action:none;user-select:none}
    #chain-canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
    .chain-settings-button{position:fixed;top:12px;right:12px;z-index:12;width:34px;height:34px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--site-fg,#121213);cursor:pointer}
    .chain-settings-button:hover{background:var(--site-soft,#f3f4f5)}
    .chain-settings-button svg{width:20px;height:20px;display:block;fill:currentColor}
    .chain-settings-button .close-icon{display:none}
    .chain-settings-button[aria-expanded="true"] .settings-icon{display:none}
    .chain-settings-button[aria-expanded="true"] .close-icon{display:block}
    .chain-settings{position:fixed;top:8px;right:8px;z-index:11;width:min(330px,calc(100vw - 16px));padding:52px 18px 18px;border:1px solid var(--site-line,#d3d6da);border-radius:12px;background:color-mix(in srgb,var(--site-bg,#fff) 96%,transparent);box-shadow:0 14px 42px rgba(0,0,0,.16);backdrop-filter:blur(14px);opacity:0;transform:translateY(-4px) scale(.985);transform-origin:top right;pointer-events:none;transition:opacity 90ms ease,transform 90ms ease}
    .chain-settings[data-open="true"]{opacity:1;transform:none;pointer-events:auto}
    .chain-setting{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;align-items:center;gap:10px;min-height:42px}
    .chain-setting+ .chain-setting{border-top:1px solid var(--site-line,#d3d6da)}
    .chain-setting label{font-size:12px;font-weight:700}
    .chain-setting output{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;text-align:right;color:var(--site-muted,#787c7e)}
    .chain-setting input[type="range"]{width:100%;margin:0;accent-color:currentColor}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-width:640px){.chain-stage{padding:54px 8px 8px}.chain-settings-button{top:10px;right:10px}.chain-settings{top:6px;right:6px;width:min(320px,calc(100vw - 12px))}}
  </style>
</head>
<body>
  <div class="chain-shell">
    <button id="chain-settings-button" class="chain-settings-button" type="button" aria-label="Settings" aria-expanded="false" aria-controls="chain-settings">
      <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94L14.4 2.81A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.05.31-.08.65-.08.96 0 .31.03.63.08.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.38.31.59.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.58-.24 1.12-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
      <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4Z"/></svg>
    </button>
    <aside id="chain-settings" class="chain-settings" aria-hidden="true">
      <div class="chain-setting"><label for="chain-rows">Rows</label><input id="chain-rows" type="range" min="4" max="14" step="1"><output id="chain-rows-value"></output></div>
      <div class="chain-setting"><label for="chain-cols">Columns</label><input id="chain-cols" type="range" min="4" max="12" step="1"><output id="chain-cols-value"></output></div>
      <div class="chain-setting"><label for="chain-enemies">Enemies</label><input id="chain-enemies" type="range" min="1" max="5" step="1"><output id="chain-enemies-value"></output></div>
    </aside>
    <main id="chain-stage" class="chain-stage">
      <canvas id="chain-canvas" aria-label="Chain Reaction board"></canvas>
      <div id="chain-status" class="sr-only" aria-live="polite"></div>
    </main>
  </div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('chain-canvas');
  const stage = document.getElementById('chain-stage');
  const statusEl = document.getElementById('chain-status');
  const settingsButton = document.getElementById('chain-settings-button');
  const settingsPanel = document.getElementById('chain-settings');
  const rowsInput = document.getElementById('chain-rows');
  const colsInput = document.getElementById('chain-cols');
  const enemiesInput = document.getElementById('chain-enemies');
  const rowsValue = document.getElementById('chain-rows-value');
  const colsValue = document.getElementById('chain-cols-value');
  const enemiesValue = document.getElementById('chain-enemies-value');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

  const EMPTY = 0;
  const HUMAN = 1;
  const PLAYER_COLORS = ['','#3b82f6','#ef4444','#22c55e','#a855f7','#f59e0b','#06b6d4'];
  const defaults = { rows: 9, cols: 6, enemies: 1 };
  let config = loadConfig();
  let rows = config.rows;
  let cols = config.cols;
  let playerCount = config.enemies + 1;
  let board, owners, degree, neighbors, entered;
  let turn = HUMAN;
  let locked = false;
  let gameOver = false;
  let cssW = 0, cssH = 0, cell = 0, ox = 0, oy = 0, dpr = 1;
  let frame = 0;
  let particles = [];
  let gameVersion = 0;

  function clampInt(value, min, max, fallback) {
    const n = Number.parseInt(value, 10);
    return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
  }

  function loadConfig() {
    try {
      const saved = JSON.parse(localStorage.getItem('samey.chain.settings') || '{}');
      return {
        rows: clampInt(saved.rows, 4, 14, defaults.rows),
        cols: clampInt(saved.cols, 4, 12, defaults.cols),
        enemies: clampInt(saved.enemies, 1, 5, defaults.enemies),
      };
    } catch { return {...defaults}; }
  }

  function saveConfig() {
    try { localStorage.setItem('samey.chain.settings', JSON.stringify(config)); } catch {}
  }

  function buildBoard() {
    rows = config.rows;
    cols = config.cols;
    playerCount = config.enemies + 1;
    board = new Uint8Array(rows * cols);
    owners = new Uint8Array(rows * cols);
    degree = new Uint8Array(rows * cols);
    neighbors = Array.from({length: rows * cols}, () => []);
    entered = new Uint8Array(playerCount + 1);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (r) neighbors[i].push(i - cols);
      if (c) neighbors[i].push(i - 1);
      if (c + 1 < cols) neighbors[i].push(i + 1);
      if (r + 1 < rows) neighbors[i].push(i + cols);
      degree[i] = neighbors[i].length;
    }
  }

  const css = () => getComputedStyle(document.documentElement);
  const color = (name, fallback) => css().getPropertyValue(name).trim() || fallback;
  const playerColor = player => PLAYER_COLORS[player] || `hsl(${(player * 67) % 360} 72% 54%)`;

  function layout() {
    const rect = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const gap = 2;
    cell = Math.max(18, Math.floor(Math.min((rect.width - 24) / cols, (rect.height - 24) / rows)));
    cssW = cols * cell + gap;
    cssH = rows * cell + gap;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ox = gap / 2; oy = gap / 2;
    draw(performance.now());
  }

  function center(i) {
    return [ox + (i % cols + .5) * cell, oy + (Math.floor(i / cols) + .5) * cell];
  }

  function atomOffsets(n, radius) {
    if (n <= 1) return [[0,0]];
    if (n === 2) return [[-radius*.36,0],[radius*.36,0]];
    if (n === 3) return [[0,-radius*.39],[-radius*.36,radius*.28],[radius*.36,radius*.28]];
    return [[-radius*.32,-radius*.32],[radius*.32,-radius*.32],[-radius*.32,radius*.32],[radius*.32,radius*.32]];
  }

  function draw(now) {
    frame = 0;
    const bg = color('--site-bg', '#fff');
    const line = color('--site-line', '#d3d6da');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.lineWidth = 1;
    ctx.strokeStyle = line;
    ctx.beginPath();
    for (let c = 0; c <= cols; c++) { const x = ox + c * cell; ctx.moveTo(x, oy); ctx.lineTo(x, oy + rows * cell); }
    for (let r = 0; r <= rows; r++) { const y = oy + r * cell; ctx.moveTo(ox, y); ctx.lineTo(ox + cols * cell, y); }
    ctx.stroke();

    const atomR = Math.max(3.8, Math.min(11, cell * .135));
    for (let i = 0; i < board.length; i++) {
      const count = board[i]; if (!count) continue;
      const [cx, cy] = center(i);
      ctx.fillStyle = playerColor(owners[i]);
      for (const [dx,dy] of atomOffsets(count, atomR)) {
        ctx.beginPath(); ctx.arc(cx + dx, cy + dy, atomR, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (particles.length) {
      let alive = false;
      for (const p of particles) {
        const t = Math.min(1, (now - p.start) / p.duration);
        if (t < 1) alive = true;
        const e = 1 - (1 - t) * (1 - t);
        const x = p.x0 + (p.x1 - p.x0) * e;
        const y = p.y0 + (p.y1 - p.y0) * e;
        ctx.globalAlpha = 1 - t * .12;
        ctx.fillStyle = playerColor(p.owner);
        ctx.beginPath(); ctx.arc(x, y, atomR, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (alive) requestDraw(); else particles = [];
    }

    if (!gameOver && turn > EMPTY) {
      ctx.strokeStyle = playerColor(turn);
      ctx.lineWidth = 2;
      ctx.strokeRect(ox + 1, oy + 1, cols * cell - 2, rows * cell - 2);
    }
  }

  function requestDraw() { if (!frame) frame = requestAnimationFrame(draw); }

  function winner() {
    for (let player = 1; player <= playerCount; player++) if (!entered[player]) return EMPTY;
    let sole = EMPTY;
    for (let i = 0; i < board.length; i++) if (board[i]) {
      const owner = owners[i];
      if (!sole) sole = owner;
      else if (sole !== owner) return EMPTY;
    }
    return sole;
  }

  function updateStatus() {
    if (gameOver) statusEl.textContent = turn === HUMAN ? 'You win' : `Enemy ${turn - 1} wins`;
    else statusEl.textContent = turn === HUMAN ? 'Your turn' : `Enemy ${turn - 1} turn`;
  }

  function applyAtom(i, owner) { owners[i] = owner; board[i]++; }

  async function playMove(start, owner) {
    const version = gameVersion;
    locked = true;
    entered[owner] = 1;
    const queue = [start];
    let head = 0;
    while (head < queue.length && !gameOver) {
      const waveEnd = queue.length;
      const transfers = [];
      while (head < waveEnd) {
        const i = queue[head++];
        applyAtom(i, owner);
        if (board[i] < degree[i]) continue;
        board[i] -= degree[i];
        if (board[i] === 0) owners[i] = EMPTY;
        const [x0,y0] = center(i);
        for (const n of neighbors[i]) {
          const [x1,y1] = center(n);
          transfers.push({x0,y0,x1,y1,owner,start:performance.now(),duration:105});
          queue.push(n);
        }
      }
      requestDraw();
      if (transfers.length) {
        particles = transfers;
        await new Promise(resolve => setTimeout(resolve, 82));
        if (version !== gameVersion) return;
      }
      const win = winner();
      if (win) {
        gameOver = true;
        turn = win;
        updateStatus();
        requestDraw();
        locked = false;
        return;
      }
    }
    particles = [];
    locked = false;
    turn = nextPlayer(owner);
    updateStatus();
    requestDraw();
  }

  function legalMoves(owner) {
    const out = [];
    for (let i = 0; i < board.length; i++) if (board[i] === 0 || owners[i] === owner) out.push(i);
    return out;
  }

  function hasCells(owner) {
    for (let i = 0; i < owners.length; i++) if (owners[i] === owner) return true;
    return false;
  }

  function nextPlayer(owner) {
    for (let step = 1; step <= playerCount; step++) {
      const candidate = ((owner - 1 + step) % playerCount) + 1;
      if (!entered[candidate] || hasCells(candidate)) return candidate;
    }
    return HUMAN;
  }

  async function continueTurns() {
    const version = gameVersion;
    while (version === gameVersion && !gameOver && turn !== HUMAN && !locked) {
      const player = turn;
      const moves = legalMoves(player);
      if (!moves.length) { entered[player] = 1; turn = nextPlayer(player); continue; }
      await new Promise(resolve => setTimeout(resolve, 65 + Math.random() * 70));
      if (version !== gameVersion || gameOver || turn !== player || locked) return;
      const idx = moves[(Math.random() * moves.length) | 0];
      await playMove(idx, player);
    }
  }

  async function humanMove(i) {
    if (locked || gameOver || turn !== HUMAN) return;
    if (board[i] !== 0 && owners[i] !== HUMAN) {
      canvas.animate([{transform:'translateX(0)'},{transform:'translateX(-2px)'},{transform:'translateX(2px)'},{transform:'translateX(0)'}], {duration:95});
      return;
    }
    await playMove(i, HUMAN);
    continueTurns();
  }

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left - ox;
    const y = e.clientY - rect.top - oy;
    if (x < 0 || y < 0) return -1;
    const c = Math.floor(x / cell), r = Math.floor(y / cell);
    if (c < 0 || c >= cols || r < 0 || r >= rows) return -1;
    return r * cols + c;
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const i = cellFromEvent(e);
    if (i >= 0) humanMove(i);
  });

  function reset() {
    gameVersion++;
    particles = [];
    turn = HUMAN;
    locked = false;
    gameOver = false;
    buildBoard();
    updateStatus();
    layout();
  }

  function setSettingsOpen(open) {
    settingsPanel.dataset.open = String(open);
    settingsPanel.setAttribute('aria-hidden', String(!open));
    settingsButton.setAttribute('aria-expanded', String(open));
  }

  function syncSettings() {
    rowsInput.value = String(config.rows);
    colsInput.value = String(config.cols);
    enemiesInput.value = String(config.enemies);
    rowsValue.value = String(config.rows);
    colsValue.value = String(config.cols);
    enemiesValue.value = String(config.enemies);
  }

  function applySettings() {
    config = {
      rows: clampInt(rowsInput.value, 4, 14, defaults.rows),
      cols: clampInt(colsInput.value, 4, 12, defaults.cols),
      enemies: clampInt(enemiesInput.value, 1, 5, defaults.enemies),
    };
    syncSettings();
    saveConfig();
    reset();
  }

  settingsButton.addEventListener('click', () => setSettingsOpen(settingsButton.getAttribute('aria-expanded') !== 'true'));
  settingsPanel.addEventListener('pointerdown', e => e.stopPropagation());
  document.addEventListener('pointerdown', e => {
    if (settingsButton.getAttribute('aria-expanded') === 'true' && !settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) setSettingsOpen(false);
  });
  for (const input of [rowsInput, colsInput, enemiesInput]) input.addEventListener('input', applySettings);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setSettingsOpen(false); });

  syncSettings();
  buildBoard();
  updateStatus();
  new ResizeObserver(layout).observe(stage);
  window.addEventListener('sameyappearancechange', requestDraw);
  new MutationObserver(requestDraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-kb-theme','style']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', requestDraw);
  layout();
})();
</script>
</body>
</html>
